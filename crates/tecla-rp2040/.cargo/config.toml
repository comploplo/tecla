# Linker rustflags for this target come from the workspace root
# .cargo/config.toml — don't repeat them here: cargo *joins* rustflags arrays
# from nested configs, and a duplicated -Tlink.x fails the link with
# "region 'FLASH' already defined".

[target.thumbv6m-none-eabi]
runner = "probe-rs run --chip RP2040"

[build]
target = "thumbv6m-none-eabi"

[env]
DEFMT_LOG = "debug"
