[package]
name = "tecla-rp2040"
version = "0.1.0"
edition = "2021"
description = "Tecla keyboard firmware board support for RP2040"
authors.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/tecla-rp2040"

[lints]
workspace = true

[dependencies]
tecla        = { version = "0.1.0", path = "../tecla", default-features = false, features = ["embassy", "autocomplete"] }
tecla-macros = { version = "0.1.0", path = "../tecla-macros" }

embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread"] }
embassy-rp       = { workspace = true }
embassy-usb      = { workspace = true }
embassy-time     = { workspace = true }
embassy-sync     = { workspace = true }

cortex-m     = { workspace = true }
cortex-m-rt  = { workspace = true }
defmt        = { workspace = true }
defmt-rtt    = { workspace = true }
panic-probe  = { workspace = true }
static_cell  = { workspace = true }
heapless     = { workspace = true }
portable-atomic = { version = "1", features = ["critical-section"] }

cortex-m-semihosting = { version = "0.5", optional = true }

[build-dependencies]
tecla-config = { version = "0.1.0", path = "../tecla-config" }

[features]
hil = ["dep:cortex-m-semihosting"]
steno-dictionary = []
# Demonstrates running autocorrect on core1 (build.rs emits a small demo trie).
core1-autocorrect = ["tecla/autocorrect"]

[[example]]
name = "core1_autocorrect"
required-features = ["core1-autocorrect"]

[[example]]
name = "steno_uni_v4"
required-features = ["steno-dictionary"]

[[example]]
name = "asterisk_v1_4"
required-features = ["steno-dictionary"]
