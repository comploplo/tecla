# build.rs supplies the linker scripts for this crate's firmware targets,
# including when building extracted release archives. Do not repeat them in
# rustflags: a duplicated -Tlink.x defines the FLASH region twice.

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip nRF52840_xxAA"

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "debug"
