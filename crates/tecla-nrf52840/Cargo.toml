[package]
name = "tecla-nrf52840"
version = "0.1.0"
edition = "2021"
description = "Tecla keyboard firmware board support for nRF52840"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/tecla-nrf52840"

[package.metadata.docs.rs]
default-target = "thumbv7em-none-eabihf"
targets = ["thumbv7em-none-eabihf"]

[lints]
workspace = true

[dependencies]
tecla        = { version = "0.1.0", path = "../tecla", features = ["embassy", "usb"] }
tecla-macros = { version = "0.1.0", path = "../tecla-macros" }

embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread"] }
embassy-nrf      = { workspace = true }
embassy-usb      = { workspace = true }
embassy-time     = { workspace = true }
embassy-sync     = { workspace = true }

# The critical-section implementation is a feature, not a default: exactly one
# crate in the binary may provide it. Non-BLE builds use cortex-m's
# single-core impl (see `cs-single-core`); BLE builds must use
# nrf-mpsl's, because the SoftDevice controller owns interrupt masking.
cortex-m     = { workspace = true }
cortex-m-rt  = { workspace = true }
defmt        = { workspace = true }
defmt-rtt    = { workspace = true }
panic-probe  = { workspace = true }
static_cell  = { workspace = true }
heapless     = { workspace = true }
portable-atomic = { version = "1", features = ["critical-section"] }

cortex-m-semihosting = { version = "0.6", optional = true }

# The host and controller exchange bt-hci types, so keep them on the same
# generation. Their current releases share 0.10 even though 0.11 exists.
trouble-host       = { version = "0.8", optional = true, default-features = false, features = ["peripheral", "gatt", "derive", "security", "default-packet-pool"] }
nrf-sdc            = { version = "0.4", optional = true, default-features = false, features = ["peripheral"] }
nrf-mpsl           = { version = "0.4", optional = true, default-features = false }
bt-hci             = { version = "0.10", optional = true }
embassy-futures    = { version = "0.1", optional = true }

[features]
default = ["cs-single-core"]

# cortex-m's single-core critical-section implementation. On by default;
# turn it off (--no-default-features) when building with `ble`, which brings
# nrf-mpsl's implementation instead. Enabling both is a "symbol multiply
# defined: _critical_section_1_0_acquire" link error.
cs-single-core = ["cortex-m/critical-section-single-core"]

hil = ["dep:cortex-m-semihosting"]
ble = ["dep:trouble-host", "dep:nrf-sdc", "dep:nrf-mpsl", "dep:bt-hci", "dep:embassy-futures", "nrf-sdc/nrf52840", "nrf-sdc/defmt", "nrf-mpsl/nrf52840", "nrf-mpsl/defmt", "nrf-mpsl/critical-section-impl"]

[[example]]
name = "hil_keyboard"
required-features = ["hil"]

[[example]]
name = "hil_matrix_test"
required-features = ["hil"]

[[example]]
name = "planck_ble"
required-features = ["ble"]
# Build with: cargo build -p tecla-nrf52840 --example planck_ble \
#   --no-default-features --features ble --target thumbv7em-none-eabihf
# (--no-default-features because nrf-mpsl provides critical-section here.)
