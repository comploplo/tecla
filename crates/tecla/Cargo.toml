[package]
name = "tecla"
version = "0.1.0"
edition = "2021"
description = "Embedded Rust keyboard firmware core — no_std, async-first, MCU-agnostic"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/tecla"
# Integration tests and benchmarks use repository keyboard profiles, fixtures,
# and path-only development tools. Run them from a checkout (`just test`);
# they are not a standalone test suite for the published library archive.
exclude = ["tests/", "benches/"]

[lints]
workspace = true

[package.metadata.docs.rs]
# Not all-features: `usb` pulls embassy-usb -> ssmarshal, which does not build
# with `std`, and docs.rs builds for a host target. The embedded package
# checks cover the USB reporter separately.
features = ["testing", "embassy", "storage", "via", "autocorrect", "autocomplete"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["autocorrect", "autocomplete", "processor-telemetry"]

# Inline processor collectors cost several KiB even before collection is enabled.
# Small boards can omit them while keeping the standalone telemetry types.
processor-telemetry = []

# Trie-based typo correction (AutocorrectEngine). Optional for minimal builds.
# The edit-distance search is the heaviest pure-logic path in the crate; drop
# this feature to shrink the binary on flash-constrained targets.
autocorrect = []

# Trie-based prefix completion (AutocompleteEngine). Optional for minimal builds.
autocomplete = []

# Enables std — host-side testing, simulation, and build tooling.
# The core library is no_std by default.
std = []

# Alias for `std`, used by the coverage and integration-test targets.
testing = ["std"]

# Enables the async Embassy orchestrator — task::run() and the async scanner /
# reporter traits. Requires an Embassy time driver in the final binary.
embassy = ["dep:embassy-time", "dep:embassy-sync", "dep:embedded-io-async"]

# Composite USB reporter — one HID interface per report variant plus USB-MIDI.
# Board crates enable this and re-export CompositeUsbReporter rather than each
# reimplementing the same routing.
#
# MUTUALLY EXCLUSIVE WITH `std`/`testing`: embassy-usb depends on ssmarshal,
# which does not compile when serde has `std` enabled. This is why the host
# gates use an explicit feature list rather than --all-features, and why
# `just hack` excludes it. The feature is exercised by `just build-boards`,
# which cross-compiles every board crate with it enabled.
usb = ["embassy", "dep:embassy-usb"]

# USB-MIDI interface on the composite reporter. Separate from `usb` because
# embassy-usb's MIDI class costs ~4KB of flash — enough to overflow an
# STM32F303CC that only wanted a keyboard.
usb-midi = ["usb"]
storage = ["dep:postcard", "dep:embedded-storage-async", "dep:sequential-storage", "dep:serde"]
via = ["storage"]

[dependencies]
embedded-hal       = { workspace = true }
heapless           = { workspace = true }
defmt              = { workspace = true }

embassy-time = { workspace = true, optional = true }
embassy-sync     = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }
embassy-usb      = { workspace = true, optional = true }

serde = { workspace = true, optional = true }

postcard               = { workspace = true, optional = true }
embedded-storage-async = { workspace = true, optional = true }
sequential-storage     = { workspace = true, optional = true }

[dev-dependencies]
# Checkout integration tests exercise macro keymaps. Keep this path-only so
# the published core does not depend on the macros crate.
tecla-macros    = { path = "../tecla-macros" }
similar-asserts = { workspace = true }
serde_json      = { workspace = true }
tecla-config    = { path = "../tecla-config" }
proptest        = { workspace = true }
criterion       = { workspace = true }
embedded-hal-async = { workspace = true }
embassy-futures = "0.1"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
# Host tests exercise async delivery failures without an embedded RTT logger.
defmt = { workspace = true, features = ["unstable-test"] }

[[bench]]
name = "dafsa_lookup"
harness = false
required-features = ["testing"]

[[bench]]
name = "process_event"
harness = false
required-features = ["testing"]
