[package]
name = "tecla"
version = "0.1.0"
edition = "2021"
description = "Embedded Rust keyboard firmware core — no_std, async-first, MCU-agnostic"
authors.workspace = true
license.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/tecla"

[lints]
workspace = true

[features]
default = ["autocorrect", "autocomplete"]

# Trie-based typo correction (AutocorrectEngine). Optional for minimal builds.
# The edit-distance search is the heaviest pure-logic path in the crate; drop
# this feature to shrink the binary on flash-constrained targets.
autocorrect = []

# Trie-based prefix completion (AutocompleteEngine). Optional for minimal builds.
autocomplete = []

# Enables std — host-side testing, simulation, and build tooling.
# The core library is no_std by default.
std = []

# Unlocks deterministic clock injection and the simulate! macro for tests.
testing = ["std"]

# Hardware-in-the-loop integration tests via Renode + Podman/Docker.
hil = ["std"]

# Enables the async Embassy orchestrator — task::run() and the async scanner /
# reporter traits. Requires an Embassy time driver in the final binary.
embassy = ["dep:embassy-time", "dep:embassy-sync", "dep:embedded-io-async"]
storage = ["dep:postcard", "dep:embedded-storage-async", "dep:sequential-storage", "dep:serde"]
via = ["storage"]

# MCU arch — these will gate embassy-executor features in board crates.
arch-cortex-m = []
arch-riscv32  = []
arch-avr      = []

[dependencies]
embedded-hal       = { workspace = true }
heapless           = { workspace = true }
defmt              = { workspace = true }

embassy-time = { workspace = true, optional = true }
embassy-sync     = { workspace = true, optional = true }
embedded-io-async = { workspace = true, optional = true }

serde = { workspace = true, optional = true }

postcard               = { workspace = true, optional = true }
embedded-storage-async = { workspace = true, optional = true }
sequential-storage     = { workspace = true, optional = true }

[dev-dependencies]
similar-asserts = { workspace = true }
serde_json      = { workspace = true }
tecla-config    = { version = "0.1.0", path = "../tecla-config" }
