[package]
name = "tecla-macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros for tecla — keymap!, steno!, layer!, MT!, LT!, and #[keyboard_main]"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/tecla-macros"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn        = { workspace = true }
quote      = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
similar-asserts = { workspace = true }
heapless        = { workspace = true }
trybuild        = { workspace = true }
# Keep the core dependency in release archives so documentation examples and
# macro tests can compile. The core's reverse development dependency is path-only
# and stripped during packaging, so it does not create a publication cycle.
tecla = { version = "0.1.0", path = "../tecla", default-features = false, features = ["std"] }
