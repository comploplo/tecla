[package]
name = "tecla-macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros for tecla — keymap!, steno!, layer!, MT!, LT!, and #[keyboard_main]"
authors.workspace = true
license.workspace = true

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn        = { workspace = true }
quote      = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
similar-asserts = { workspace = true }
heapless        = { workspace = true }
trybuild        = { workspace = true }
tecla = { path = "../tecla", features = ["std"] }
