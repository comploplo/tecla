[package]
name = "tecla-macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros for tecla — keymap!, steno!, layer!, MT!, LT!, and #[keyboard_main]"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/tecla-macros"

[lib]
proc-macro = true

[lints]
workspace = true

[dependencies]
syn        = { workspace = true }
quote      = { workspace = true }
proc-macro2 = { workspace = true }

[dev-dependencies]
similar-asserts = { workspace = true }
heapless        = { workspace = true }
trybuild        = { workspace = true }
# Path-only (no version): tecla dev-depends on tecla-macros too, so a
# version requirement here would make the pair unpublishable. Cargo strips
# path-only dev-dependencies from the packaged manifest.
tecla = { path = "../tecla", features = ["std"] }
