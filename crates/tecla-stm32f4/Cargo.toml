[package]
name = "tecla-stm32f4"
version = "0.1.0"
edition = "2021"
description = "Tecla keyboard firmware board support for STM32F4"
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
documentation = "https://docs.rs/tecla-stm32f4"

[lints]
workspace = true

[dependencies]
tecla        = { version = "0.1.0", path = "../tecla", features = ["embassy", "usb"] }
tecla-macros = { version = "0.1.0", path = "../tecla-macros" }

embassy-executor = { workspace = true, features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32    = { workspace = true }
embassy-usb      = { workspace = true }
embassy-time     = { workspace = true }
embassy-sync     = { workspace = true }

cortex-m     = { workspace = true, features = ["critical-section-single-core"] }
cortex-m-rt  = { workspace = true }
defmt        = { workspace = true }
defmt-rtt    = { workspace = true }
panic-probe  = { workspace = true }
static_cell  = { workspace = true }
heapless     = { workspace = true }
portable-atomic = { version = "1", features = ["critical-section"] }
