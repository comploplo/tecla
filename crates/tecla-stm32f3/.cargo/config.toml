# build.rs supplies the linker scripts for this crate's firmware targets,
# including when building extracted release archives. Do not repeat them in
# rustflags: a duplicated -Tlink.x defines the FLASH region twice.
#
# The Voyager flashes over its ZSA DFU bootloader, not SWD. Build the ELF, then:
#   arm-none-eabi-objcopy -O binary <elf> voyager.bin
#   dfu-util -a 0 -d 3297:0791 -s 0x08002000:leave -D voyager.bin
# (put the board in bootloader first — hold the small reset button on the back.)

[build]
target = "thumbv7em-none-eabihf"

[env]
DEFMT_LOG = "debug"
