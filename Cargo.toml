[workspace]
members = [
    "crates/tecla",
    "crates/tecla-config",
    "crates/tecla-macros",
    "crates/tecla-instrument-tests",
    "crates/tecla-rp2040",
    "crates/tecla-nrf52840",
    "crates/tecla-stm32f4",
    "crates/tecla-stm32f3",
    "crates/tecla-stm32f0",
]
# ESP32 uses a separate Xtensa toolchain; re-include after its firmware build
# and hardware behavior are validated.
exclude = [
    "crates/tecla-esp32s3",
]
resolver = "2"

[workspace.package]
authors = ["Gabe Oppenheimer"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/comploplo/tecla"
readme = "README.md"
keywords = ["keyboard", "firmware", "embedded", "hid", "no-std"]
categories = ["embedded", "hardware-support", "no-std"]

# ---------------------------------------------------------------------------
# Workspace-wide lints — inherited by all crates via `lints.workspace = true`
# ---------------------------------------------------------------------------

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "deny"
missing_docs = "deny"

# ---------------------------------------------------------------------------
# Shared dependency versions — crates reference these via `workspace = true`
# ---------------------------------------------------------------------------

[workspace.dependencies]

# Core embedded abstractions
embedded-hal       = "1"
embedded-hal-async = "1"

# Async runtime
embassy-executor = { version = "0.10", features = ["executor-thread"] }
embassy-time     = "0.5"
embassy-usb      = "0.6"
embassy-sync     = "0.8"

# no_std utilities
heapless = "0.9"

# Embedded logging (zero-overhead, RTT-based)
defmt = "1"

# Serialization (std-only, used by tecla core for config round-tripping)
# default-features = false: tecla is no_std and uses serde via postcard for
# flash storage. With std on, the `storage`/`via` features cannot compile for
# any embedded target at all. Host crates opt back into std explicitly.
serde      = { version = "1", default-features = false, features = ["derive"] }
serde_json = "1"
noyalib    = { version = "0.0.58", default-features = false, features = ["std", "compat-serde-yaml"] }
nom        = "8"
toml       = "1"

# Persistent storage
embedded-storage-async = "0.4"
# heapless-09, not heapless: v8 ships a Value impl per heapless generation and
# this workspace is on heapless 0.9.
sequential-storage     = { version = "8", features = ["heapless-09"] }
embedded-io-async      = "0.7"
postcard               = { version = "1", default-features = false, features = ["heapless"] }

# Proc macro utilities (tecla-macros)
syn = { version = "3", features = ["full"] }
quote      = "1"
proc-macro2 = "1"

# RP2040 board support
embassy-rp  = { version = "0.10", features = ["defmt", "time-driver", "critical-section-impl", "rp2040"] }
embassy-nrf = { version = "0.11", features = ["nrf52840", "time-driver-rtc1", "gpiote", "unstable-pac"] }
embassy-stm32 = { version = "0.6", features = ["stm32f411ce", "time-driver-any", "exti", "unstable-pac"] }
cortex-m    = { version = "0.7", features = ["inline-asm"] }
cortex-m-rt = "0.7"
defmt-rtt   = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
static_cell = "2"

# Tree-sitter (C parser for QMK keymap transpiler)
tree-sitter   = "0.27"
tree-sitter-c = "0.24"

# Testing
similar-asserts = "2"
trybuild        = { version = "1", features = ["diff"] }
insta           = { version = "1", features = ["glob"] }
proptest        = "1"
criterion       = "0.8"

[profile.release]
debug         = 2
lto           = true
opt-level     = "s"
codegen-units = 1

# Size-optimize dependencies (embassy, metapac, …) even in dev so debug
# firmware still fits the smaller MCUs' flash (the F303's 248K app region
# overflows by ~53K at O0). Workspace crates stay at opt-level 0 for fast
# rebuilds and honest debugging.
[profile.dev.package."*"]
opt-level = "s"
